<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
    <h1>📦 Warehouse Dashboard</h1>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Total Order</h3>
            <h1>2,350</h1>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <h1>2,210</h1>
        </div>

        <div class="card">
            <h3>Accuracy</h3>
            <h1>99.3%</h1>
        </div>

        <div class="card">
            <h3>Picking Error</h3>
            <h1>18</h1>
        </div>

    </div>

    <div class="chart">
        <canvas id="orderChart"></canvas>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
